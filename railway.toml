[build]
builder = "nixpacks"

[deploy]
startCommand = "python manage.py migrate --no-input && python manage.py seed_data && gunicorn Attendpay.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
releaseCommand = "python manage.py collectstatic --no-input"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
